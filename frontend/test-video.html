<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Video Player - Cashora</title>
    <style>
        body {
            background: #0a0f1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #8899ff; }
        .video-container {
            background: #13183a;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
        }
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            background: black;
        }
        button {
            background: #4361ee;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #5570ff;
        }
        .info {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #4361ee;
        }
        .success { border-left-color: #4caf50; }
        .error { border-left-color: #f44336; }
        code {
            background: #0a0f1e;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .log {
            background: #0a0f1e;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🎬 Cashora Video Generation Test</h1>
    
    <div class="info">
        <h3>Test Generated Video</h3>
        <p>This page tests if the video generated by Blotato can be played in your browser.</p>
    </div>

    <div class="video-container">
        <h3>Video Player</h3>
        <video id="testVideo" controls>
            <source src="https://database.blotato.io/storage/v1/object/public/public_media/23c6b38b-50ab-4d36-9b61-23cada1a1e25/videogen2-render-14910198-47d7-4943-a3ef-6d5e63ff9470.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div style="margin-top: 20px;">
            <button onclick="playVideo()">▶️ Play</button>
            <button onclick="pauseVideo()">⏸️ Pause</button>
            <button onclick="downloadVideo()">⬇️ Download</button>
            <button onclick="testNewVideo()">🎬 Generate New Video</button>
        </div>
    </div>

    <div class="info">
        <h3>Video Info</h3>
        <p><strong>Video ID:</strong> <code>32f71848-47e3-478e-a4f0-624b86d3c0cb</code></p>
        <p><strong>Status:</strong> <code id="videoStatus">Loading...</code></p>
        <p><strong>Created:</strong> <code id="videoCreated">Loading...</code></p>
        <p><strong>URL:</strong> <code style="word-break: break-all;" id="videoUrl">Loading...</code></p>
    </div>

    <div class="info">
        <h3>Console Log</h3>
        <div class="log" id="consoleLog"></div>
    </div>

    <script>
        const video = document.getElementById('testVideo');
        const consoleLog = document.getElementById('consoleLog');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f44336' : type === 'success' ? '#4caf50' : '#8899ff';
            consoleLog.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
            console.log(message);
        }

        function playVideo() {
            video.play();
            log('▶️ Playing video', 'success');
        }

        function pauseVideo() {
            video.pause();
            log('⏸️ Paused video', 'info');
        }

        function downloadVideo() {
            const url = video.querySelector('source').src;
            const a = document.createElement('a');
            a.href = url;
            a.download = `cashora-video-${Date.now()}.mp4`;
            a.click();
            log('⬇️ Downloading video', 'success');
        }

        async function testNewVideo() {
            log('🎬 Starting new video generation...', 'info');
            
            try {
                // Step 1: Enhance prompt
                log('Step 1: Enhancing prompt with Gemini...', 'info');
                const enhanceRes = await fetch('/api/video/enhance-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ prompt: 'A cat playing with yarn' })
                });
                const enhanceData = await enhanceRes.json();
                
                if (!enhanceData.success) {
                    throw new Error(enhanceData.error);
                }
                
                log('✅ Prompt enhanced: ' + enhanceData.enhancedPrompt.substring(0, 100) + '...', 'success');
                
                // Step 2: Generate video
                log('Step 2: Generating video with Blotato...', 'info');
                const generateRes = await fetch('/api/video/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        enhancedPrompt: enhanceData.enhancedPrompt,
                        duration: 10,
                        aspectRatio: '16:9',
                        visualStyle: 'cinematic'
                    })
                });
                const generateData = await generateRes.json();
                
                if (!generateData.success) {
                    throw new Error(generateData.error);
                }
                
                log('✅ Video generation started! Video ID: ' + generateData.videoId, 'success');
                log('⏳ Polling for completion (this may take 3-5 minutes)...', 'info');
                
                // Step 3: Poll for completion
                pollVideoStatus(generateData.videoId);
                
            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
            }
        }

        async function pollVideoStatus(videoId) {
            let attempts = 0;
            const maxAttempts = 40; // 10 minutes
            
            const poll = async () => {
                attempts++;
                
                try {
                    const statusRes = await fetch(`/api/video/status/${videoId}`, {
                        credentials: 'include'
                    });
                    const statusData = await statusRes.json();
                    
                    log(`📊 Poll ${attempts}: Status = ${statusData.status}`, 'info');
                    
                    if (statusData.status === 'done' && statusData.mediaUrl) {
                        log('🎉 Video complete! URL: ' + statusData.mediaUrl, 'success');
                        
                        // Update video player
                        video.querySelector('source').src = statusData.mediaUrl;
                        video.load();
                        
                        document.getElementById('videoStatus').textContent = 'done';
                        document.getElementById('videoUrl').textContent = statusData.mediaUrl;
                        
                        return;
                    }
                    
                    if (attempts >= maxAttempts) {
                        log('⏱️ Timeout after ' + attempts + ' attempts', 'error');
                        return;
                    }
                    
                    // Continue polling
                    setTimeout(poll, 15000);
                    
                } catch (err) {
                    log('❌ Status check error: ' + err.message, 'error');
                }
            };
            
            poll();
        }

        // Check video status on load
        async function checkVideoStatus() {
            try {
                const res = await fetch('/api/video/status/32f71848-47e3-478e-a4f0-624b86d3c0cb', {
                    credentials: 'include'
                });
                const data = await res.json();
                
                document.getElementById('videoStatus').textContent = data.status || 'unknown';
                document.getElementById('videoCreated').textContent = data.createdAt || 'unknown';
                document.getElementById('videoUrl').textContent = data.mediaUrl || 'not available';
                
                log('Video status checked: ' + data.status, 'success');
            } catch (err) {
                log('Error checking video status: ' + err.message, 'error');
            }
        }

        // Event listeners
        video.addEventListener('loadeddata', () => {
            log('✅ Video loaded successfully', 'success');
        });

        video.addEventListener('error', (e) => {
            log('❌ Video error: ' + e.message, 'error');
        });

        // Initialize
        log('🚀 Test page loaded');
        checkVideoStatus();
    </script>
</body>
</html>
